<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7e6e6"/>
      <stop offset="1" stop-color="#F8F6F2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="rgba(255, 255, 255, 0.55)"/>
      <stop offset="1" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
    <radialGradient id="crop" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.75" stop-color="rgba(212, 213, 216, 0.55)"/>
      <stop offset="1" stop-color="rgba(190, 192, 200, 0.5)"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  <rect x="40" y="40" width="720" height="920" fill="none" stroke="rgba(212, 213, 216, 0.6)" stroke-width="1"/>
  
