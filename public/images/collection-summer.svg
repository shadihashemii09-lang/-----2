<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e9e8e2"/>
      <stop offset="1" stop-color="#F8F6F2"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="rgba(255, 255, 255, 0.55)"/>
      <stop offset="1" stop-color="rgba(255, 255, 255, 0)"/>
    </radialGradient>
    <radialGradient id="crop" cx="0.5" cy="0.5" r="0.75">
      <stop offset="0.75" stop-color="rgba(216, 217, 207, 0.55)"/>
      <stop offset="1" stop-color="rgba(196, 199, 185, 0.5)"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.05"/></feComponentTransfer>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <rect width="100%" height="100%" fill="url(#glow)"/>
  
  
  <g transform="translate(400 500) scale(1.08)">
    <ellipse cx="0" cy="300" rx="210" ry="18" fill="rgba(31, 29, 27, 0.1)" filter="url(#blur)"/>
    <path d="M -105 -185 C -52 -202 52 -202 105 -185 C 116 -120 94 -40 76 -12 C 100 60 150 160 172 265 C 160 288 -160 288 -172 265 C -150 160 -100 60 -76 -12 C -94 -40 -116 -120 -105 -185 Z" fill="var(--garment)"  stroke="#2A2723" stroke-width="5.5" stroke-linejoin="round"/>
    
    <ellipse cx="-150" cy="-142" rx="46" ry="42"
      transform="rotate(-18 -150 -142)" fill="#9AA18B" stroke="#2A2723" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M -170.7 -163 Q -150 -177.7 -129.3 -163"
      fill="none" stroke="rgba(42, 39, 35, 0.55)" stroke-width="4" stroke-linecap="round"/>
    <ellipse cx="150" cy="-142" rx="46" ry="42"
      transform="rotate(18 150 -142)" fill="#9AA18B" stroke="#2A2723" stroke-width="5.5" stroke-linejoin="round"/>
    <path d="M 129.3 -163 Q 150 -177.7 170.7 -163"
      fill="none" stroke="rgba(42, 39, 35, 0.55)" stroke-width="4" stroke-linecap="round"/>
    <path d="M -98 -182 L 0 -80 L 98 -182" fill="none" stroke="rgba(42, 39, 35, 0.6)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 0 -80 L 0 280" fill="none" stroke="rgba(42, 39, 35, 0.6)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 76 -12 Q 0 2 -76 -12" fill="none" stroke="rgba(42, 39, 35, 0.6)" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="-35" r="4.5" fill="#eae9e9" stroke="#2A2723" stroke-width="3"/><circle cx="0" cy="23" r="4.5" fill="#eae9e9" stroke="#2A2723" stroke-width="3"/>
  </g>
  <rect width="100%" height="100%" filter="url(#grain)"/>
  
